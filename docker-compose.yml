services:
  app:
    build: .
    container_name: myapp
    env_file:
      - .env
    #volumes:
    # - .:/app # useful for development, remove in prod, or during migrations
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "-c", "poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000"]

  db:
    image: postgres:15
    container_name: mydb
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  migrate:
    build: .
    env_file: [.env]
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "poetry run alembic upgrade head"]
    restart: "no"

volumes:
  postgres_data:
